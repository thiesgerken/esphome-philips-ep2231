# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v4.4.0"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "https://github.com/pre-commit/mirrors-prettier"
rev = "v3.0.0-alpha.6"
hooks = [
  { id = "prettier" }
]

# Brings its own clang-format binary; the pocc hook shells out to whatever is
# on PATH, which is not there by default on macOS. types_or is narrowed because
# the mirror also claims json and javascript, which prettier already formats.
[[repos]]
repo = "https://github.com/pre-commit/mirrors-clang-format"
rev = "v21.1.8"
hooks = [
  {
    id = "clang-format",
    types_or = ["c++", "c"]
  }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.4"
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" }
]
